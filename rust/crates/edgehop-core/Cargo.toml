[package]
name = "edgehop-core"
description = "EdgeHop core process for Windows (and any platform with a backend): speaks docs/IPC.md on stdin/stdout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
edgehop-input = { path = "../edgehop-input" }
edgehop-link = { path = "../edgehop-link" }
edgehop-proto = { path = "../edgehop-proto" }
edgehop-switch = { path = "../edgehop-switch" }
getrandom = "0.3.4"
serde_json = "1.0.154"
thiserror = "2.0.21"

[target."cfg(windows)".dependencies]
edgehop-win = { path = "../edgehop-win" }
