name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift core and app (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build everything (library, tools, helper, app)
        run: swift build
      - name: Unit tests
        run: swift test
      - name: IPC smoke test against the Swift core
        run: node scripts/ipc-smoke.mjs .build/debug/edgehop-core
      - name: Build the Rust core
        run: cargo build --manifest-path rust/Cargo.toml -p edgehop-core
      - name: Swift accepts what Rust writes
        run: scripts/check-rust-compat.sh
      - name: Swift and Rust cores answer identically
        run: node scripts/ipc-conformance.mjs .build/debug/edgehop-core rust/target/debug/edgehop-core
      - name: Swift and Rust links interoperate over TCP
        run: scripts/check-link-interop.sh
      - name: Recorded switching scenarios are up to date
        run: |
          scripts/golden-vectors.sh scenarios > "$RUNNER_TEMP/scenarios.json"
          cmp "$RUNNER_TEMP/scenarios.json" rust/crates/edgehop-switch/tests/scenarios.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI dependencies
        working-directory: ui
        run: npm ci
      - name: UI type-check
        working-directory: ui
        run: npm run typecheck
      - name: UI tests (including the real Swift core)
        working-directory: ui
        run: npm test
      - name: UI build
        working-directory: ui
        run: npm run build
      - name: UI smoke test (the real Electron app, a throw-away profile, the real Swift core)
        working-directory: ui
        timeout-minutes: 3
        env:
          EDGEHOP_SMOKE: "1"
          EDGEHOP_USER_DATA: ${{ runner.temp }}/edgehop-ui-profile
        run: scripts/run-smoke.sh npx electron .
      - name: Package the app and smoke test the package (bundled Swift core)
        working-directory: ui
        timeout-minutes: 6
        env:
          EDGEHOP_SMOKE: "1"
          EDGEHOP_USER_DATA: ${{ runner.temp }}/edgehop-pack-profile
        run: |
          mkdir -p core-bin
          cp ../.build/debug/edgehop-core core-bin/edgehop-core
          npm run pack
          scripts/run-smoke.sh release/mac-arm64/EdgeHop.app/Contents/MacOS/EdgeHop
      - name: A wedged exit is ended by the app's watchdog (macOS)
        working-directory: ui
        timeout-minutes: 2
        env:
          EDGEHOP_SMOKE: "1"
          EDGEHOP_TEST_WEDGE_EXIT: "1"
          EDGEHOP_USER_DATA: ${{ runner.temp }}/edgehop-wedge-profile
        run: scripts/run-smoke.sh release/mac-arm64/EdgeHop.app/Contents/MacOS/EdgeHop

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
          rustc --version
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        timeout-minutes: 10
        run: cargo test
      - name: Windows self-test (displays, injection, feedback guard; needs an interactive desktop)
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 2
        run: cargo run -p edgehop-win --bin win-selftest
      - name: Type-check for Windows from Linux
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo check --target x86_64-pc-windows-msvc
      - name: Build the core
        if: runner.os == 'Windows'
        run: cargo build -p edgehop-core
      - name: IPC smoke test of the Rust core on Windows (real sessions, receiver and controller on loopback)
        if: runner.os == 'Windows'
        working-directory: .
        run: node scripts/ipc-smoke.mjs rust/target/debug/edgehop-core.exe --platform windows --loopback
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI dependencies
        working-directory: ui
        env:
          # Only the Windows job runs the app; Linux just type-checks and runs the unit tests.
          ELECTRON_SKIP_BINARY_DOWNLOAD: ${{ runner.os == 'Linux' && '1' || '' }}
        run: npm ci
      - name: UI type-check
        working-directory: ui
        run: npm run typecheck
      - name: UI tests (on Windows including the real Rust core)
        working-directory: ui
        run: npm test
      - name: UI build
        if: runner.os == 'Windows'
        working-directory: ui
        run: npm run build
      - name: UI smoke test (the real Electron app, a throw-away profile, the real Rust core)
        if: runner.os == 'Windows'
        working-directory: ui
        timeout-minutes: 3
        env:
          EDGEHOP_SMOKE: "1"
          EDGEHOP_USER_DATA: ${{ runner.temp }}\edgehop-ui-profile
        shell: bash
        run: scripts/run-smoke.sh npx electron .
      - name: Package the app and smoke test the package (bundled Rust core)
        if: runner.os == 'Windows'
        working-directory: ui
        timeout-minutes: 6
        env:
          EDGEHOP_SMOKE: "1"
          EDGEHOP_USER_DATA: ${{ runner.temp }}\edgehop-pack-profile
        shell: bash
        run: |
          mkdir -p core-bin
          cp ../rust/target/debug/edgehop-core.exe core-bin/edgehop-core.exe
          npm run pack
          scripts/run-smoke.sh release/win-unpacked/EdgeHop.exe
      - name: A wedged exit is ended by the app's watchdog (Windows)
        if: runner.os == 'Windows'
        working-directory: ui
        timeout-minutes: 2
        shell: bash
        env:
          EDGEHOP_SMOKE: "1"
          EDGEHOP_TEST_WEDGE_EXIT: "1"
          EDGEHOP_USER_DATA: ${{ runner.temp }}\edgehop-wedge-profile
        run: scripts/run-smoke.sh release/win-unpacked/EdgeHop.exe
