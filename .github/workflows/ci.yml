name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift core and app (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build everything (library, tools, helper, app)
        run: swift build
      - name: Unit tests
        run: swift test
      - name: IPC smoke test against the Swift core
        run: node scripts/ipc-smoke.mjs .build/debug/edgehop-core
      # The next three steps need the Rust core crate (PR #8). Drop the condition once it is on main.
      - name: Build the Rust core
        if: hashFiles('rust/crates/edgehop-core/Cargo.toml') != ''
        run: cargo build --manifest-path rust/Cargo.toml -p edgehop-core
      - name: Swift accepts what Rust writes
        if: hashFiles('rust/crates/edgehop-core/Cargo.toml') != ''
        run: scripts/check-rust-compat.sh
      - name: Swift and Rust cores answer identically
        if: hashFiles('rust/crates/edgehop-core/Cargo.toml') != ''
        run: node scripts/ipc-conformance.mjs .build/debug/edgehop-core rust/target/debug/edgehop-core

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
          rustc --version
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Type-check for Windows from Linux
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo check --target x86_64-pc-windows-msvc
      - name: Build the core
        if: runner.os == 'Windows' && hashFiles('rust/crates/edgehop-core/Cargo.toml') != ''
        run: cargo build -p edgehop-core
      - name: IPC smoke test of the Rust core on Windows
        if: runner.os == 'Windows' && hashFiles('rust/crates/edgehop-core/Cargo.toml') != ''
        working-directory: .
        run: node scripts/ipc-smoke.mjs rust/target/debug/edgehop-core.exe --platform windows --stub
